<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E71FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4E71FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
  </defs>

  <!-- Modern Emblem -->
  <g transform="translate(6, 6)">
    <rect width="52" height="52" rx="14" fill="url(#logoGrad)" />
    <!-- Embedded financial chart bars with spark line -->
    <rect x="12" y="30" width="6" height="14" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="23" y="22" width="6" height="22" rx="3" fill="#FFFFFF" />
    <rect x="34" y="14" width="6" height="30" rx="3" fill="#FFFFFF" />
    <!-- Growth trajectory line -->
    <path d="M12 26 L23 18 L34 10 L40 14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="74" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Expense<tspan fill="#38BDF8">Tracker</tspan>
  </text>
</svg>
